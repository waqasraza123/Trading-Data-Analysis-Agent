name: CI

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest
        env:
          APP_ENV: test
          DATABASE_URL: ""
          TEST_DATABASE_URL: ""
      - run: alembic heads
      - run: alembic history

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_APP_NAME: Daily Trading Dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t trading-intelligence-api:ci .
      - run: docker build -f apps/web/Dockerfile -t trading-intelligence-web:ci .
